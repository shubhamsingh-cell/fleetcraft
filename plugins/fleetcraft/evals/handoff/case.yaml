schema_version: "1.0"
name: handoff
tags: [activation]
runs: 3
execution:
  prompt: |
    File content of status.md:
    Objective: release candidate. Tests: 3 passed, 1 failed. Deploy: not run. Open: reproduce the
    failing test.

    Use or load the relevant installed handoff skill if available, then preserve missing deploy
    proof. Respond in at most 220 words.
  max_turns: 3
  timeout_seconds: 120
  model: sonnet
  allowed_tools: [Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: project-handoff
    # NO arm: -- deliberately. Under --ablation with-without a tool_used:Skill grader
    # with no arm is display-only (reported, not scored). Adding arm: scores a check
    # the baseline can never pass and inflates uplift.
  - name: outcome-not-run
    type: regex
    target: last_message
    pattern: "(?i)not run"
  - name: outcome-1-failed
    type: regex
    target: last_message
    pattern: "(?i)1 failed"
