schema_version: "1.0"
name: math
tags: [activation]
runs: 3
execution:
  prompt: |
    What is 2 + 2? Respond in at most 220 words.
  max_turns: 3
  timeout_seconds: 120
  model: sonnet
  allowed_tools: [Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    min: 0
    max: 0
    arm: both
    # This IS the documented must-NOT-call form: arm: both is required here so the
    # check is scored on both arms rather than becoming a display-only indicator.
  - name: outcome-4
    type: regex
    target: last_message
    pattern: "\\b4\\b"
